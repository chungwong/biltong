<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How to Make Biltong</title>
    <meta
      name="description"
      content="A friendly, step-by-step guide to making South African biltong at home, with a spice calculator that scales the recipe to any amount of beef."
    />
    <meta name="theme-color" content="#7c2d12" />
    <meta property="og:title" content="How to Make Biltong" />
    <meta
      property="og:description"
      content="Step-by-step biltong guide with an ingredient calculator."
    />
    <meta property="og:type" content="website" />
    <script>
      // Apply the saved (or system) colour theme before first paint so there's no flash.
      (function () {
        try {
          var t = localStorage.getItem("biltong:theme");
          if (
            t === "dark" ||
            (!t && matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* Avoid a flash of unstyled content: keep the app hidden until the Tailwind
         stylesheet (injected by Dioxus after the WASM app boots) has actually applied. */
      #main {
        visibility: hidden;
      }
      html.app-ready #main {
        visibility: visible;
      }
      /* Match the app's page background pre-boot so there's no light flash in dark mode. */
      body {
        background-color: #fdf6f0;
      }
      html.dark body {
        background-color: #1c1917;
      }
    </style>
    <script>
      // Reveal the app only once a Tailwind *utility* has actually applied (not just a
      // theme variable, which resolves earlier in the stylesheet). We probe an off-screen
      // element carrying `bg-biltong-900` and wait for its computed colour to match.
      (function () {
        function styled() {
          var p = document.getElementById("fouc-probe");
          if (!p) return false;
          // The probe carries bg-biltong-900; until the utility applies its background is
          // transparent. Any opaque background means the utility layer is in effect.
          var c = getComputedStyle(p).backgroundColor;
          return c && c !== "rgba(0, 0, 0, 0)" && c !== "transparent";
        }
        var tries = 0;
        (function check() {
          if (styled() || tries++ > 600) {
            document.documentElement.classList.add("app-ready");
          } else {
            requestAnimationFrame(check);
          }
        })();
      })();
    </script>
  </head>
  <body>
    <div
      id="fouc-probe"
      class="bg-biltong-900"
      aria-hidden="true"
      style="position: fixed; top: 0; left: 0; width: 0; height: 0; overflow: hidden"
    ></div>
    <div id="main"></div>
    <script>
      // Scroll restoration for the WASM SPA. The browser's automatic restore runs before
      // Dioxus has rendered the page (height is still 0), so it fails and we land at the
      // top. Instead we save the position ourselves and re-apply it once the content has
      // actually grown tall enough — also handling #hash links the same way.
      (function () {
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
        var KEY = "biltong:scrollY";
        var saveTimer = null;

        addEventListener(
          "scroll",
          function () {
            if (saveTimer) return;
            saveTimer = setTimeout(function () {
              saveTimer = null;
              try {
                sessionStorage.setItem(KEY, String(Math.round(window.scrollY)));
              } catch (e) {}
            }, 150);
          },
          { passive: true }
        );

        function hashTarget() {
          if (location.hash.length > 1) {
            var el = document.getElementById(location.hash.slice(1));
            if (el) return el.getBoundingClientRect().top + window.scrollY;
          }
          return null;
        }

        function restore() {
          var saved = parseInt(sessionStorage.getItem(KEY) || "0", 10) || 0;
          var tries = 0;
          (function tick() {
            var hy = hashTarget();
            var target = hy != null ? hy : saved;
            if (target <= 0) return;
            var ready =
              document.documentElement.scrollHeight >=
              target + window.innerHeight - 1;
            if (ready || tries++ > 180) {
              window.scrollTo(0, target);
            } else {
              requestAnimationFrame(tick);
            }
          })();
        }

        if (document.readyState === "complete") restore();
        else addEventListener("load", restore);
      })();
    </script>
  </body>
</html>
