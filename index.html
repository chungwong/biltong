<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How to Make Biltong</title>
    <meta
      name="description"
      content="A friendly, step-by-step guide to making South African biltong at home, with a spice calculator that scales the recipe to any amount of beef."
    />
    <meta name="theme-color" content="#7c2d12" />
    <meta property="og:title" content="How to Make Biltong" />
    <meta
      property="og:description"
      content="Step-by-step biltong guide with an ingredient calculator."
    />
    <meta property="og:type" content="website" />
    <script>
      // Apply the saved (or system) colour theme before first paint so there's no flash.
      (function () {
        try {
          var t = localStorage.getItem("biltong:theme");
          if (
            t === "dark" ||
            (!t && matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* FOUC guard. Hide <body> by default; the Tailwind stylesheet (injected at runtime by
         Dioxus) ends with `body { visibility: visible }`, so the page reveals exactly when
         the styles apply — a stylesheet applies atomically, so there's no race and no flash.
         The themed page background sits on <html> so it paints while the body is hidden. */
      html {
        background-color: #fdf6f0;
      }
      html.dark {
        background-color: #1c1917;
      }
      body {
        visibility: hidden;
      }
    </style>
    <script>
      // Safety net: never keep the page hidden if the stylesheet somehow fails to load.
      setTimeout(function () {
        if (document.body) document.body.style.visibility = "visible";
      }, 8000);
    </script>
  </head>
  <body>
    <div id="main"></div>
    <script>
      // Scroll restoration for the WASM SPA. The browser's automatic restore runs before
      // Dioxus has rendered the page (height is still 0), so it fails and we land at the
      // top. Instead we save the position ourselves and re-apply it once the content has
      // actually grown tall enough — also handling #hash links the same way.
      (function () {
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
        var KEY = "biltong:scrollY";
        var saveTimer = null;

        addEventListener(
          "scroll",
          function () {
            if (saveTimer) return;
            saveTimer = setTimeout(function () {
              saveTimer = null;
              try {
                sessionStorage.setItem(KEY, String(Math.round(window.scrollY)));
              } catch (e) {}
            }, 150);
          },
          { passive: true }
        );

        function hashTarget() {
          if (location.hash.length > 1) {
            var el = document.getElementById(location.hash.slice(1));
            if (el) return el.getBoundingClientRect().top + window.scrollY;
          }
          return null;
        }

        function restore() {
          var saved = parseInt(sessionStorage.getItem(KEY) || "0", 10) || 0;
          var tries = 0;
          (function tick() {
            var hy = hashTarget();
            var target = hy != null ? hy : saved;
            if (target <= 0) return;
            var ready =
              document.documentElement.scrollHeight >=
              target + window.innerHeight - 1;
            if (ready || tries++ > 180) {
              window.scrollTo(0, target);
            } else {
              requestAnimationFrame(tick);
            }
          })();
        }

        if (document.readyState === "complete") restore();
        else addEventListener("load", restore);
      })();
    </script>
  </body>
</html>
