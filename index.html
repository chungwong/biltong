<!DOCTYPE html>
<html lang="en" class="preload">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How to Make Biltong</title>
    <meta
      name="description"
      content="A friendly, step-by-step guide to making South African biltong at home, with a spice calculator that scales the recipe to any amount of beef."
    />
    <meta name="theme-color" content="#7c2d12" />
    <meta property="og:title" content="How to Make Biltong" />
    <meta
      property="og:description"
      content="Step-by-step biltong guide with an ingredient calculator."
    />
    <meta property="og:type" content="website" />
    <script>
      // Apply the saved (or system) colour theme before first paint so there's no flash.
      (function () {
        try {
          var t = localStorage.getItem("biltong:theme");
          if (
            t === "dark" ||
            (!t && matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* FOUC guard. Hide <body> by default; the Tailwind stylesheet (injected at runtime by
         Dioxus) ends with `body { visibility: visible }`, so the page reveals exactly when
         the styles apply. The themed background sits on <html> so it paints while hidden. */
      html {
        background-color: #fdf6f0;
      }
      html.dark {
        background-color: #1c1917;
      }
      body {
        visibility: hidden;
      }
      /* While loading, suppress transitions so styled values (e.g. the nav link colour)
         snap in instead of animating from the browser default (blue link → cream). */
      html.preload *,
      html.preload *::before,
      html.preload *::after {
        transition: none !important;
      }
    </style>
    <script>
      // Re-enable transitions once the stylesheet has applied (detected by <body> becoming
      // visible via the stylesheet's own rule), with a safety net so the page is never
      // stuck hidden if the stylesheet fails to load.
      (function () {
        var de = document.documentElement;
        function check() {
          if (
            document.body &&
            getComputedStyle(document.body).visibility === "visible"
          ) {
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                de.classList.remove("preload");
              });
            });
          } else {
            requestAnimationFrame(check);
          }
        }
        requestAnimationFrame(check);
        setTimeout(function () {
          if (document.body) document.body.style.visibility = "visible";
          de.classList.remove("preload");
        }, 8000);
      })();
    </script>
  </head>
  <body>
    <div id="main"></div>
    <script>
      // Scroll restoration for the WASM SPA. The browser's automatic restore runs before
      // Dioxus has rendered the page (height is still 0), so it fails and we land at the
      // top. Instead we save the position ourselves and re-apply it once the content has
      // actually grown tall enough — also handling #hash links the same way.
      (function () {
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
        var KEY = "biltong:scrollY";
        var saveTimer = null;

        addEventListener(
          "scroll",
          function () {
            if (saveTimer) return;
            saveTimer = setTimeout(function () {
              saveTimer = null;
              try {
                sessionStorage.setItem(KEY, String(Math.round(window.scrollY)));
              } catch (e) {}
            }, 150);
          },
          { passive: true }
        );

        function hashTarget() {
          if (location.hash.length > 1) {
            var el = document.getElementById(location.hash.slice(1));
            if (el) return el.getBoundingClientRect().top + window.scrollY;
          }
          return null;
        }

        function restore() {
          var saved = parseInt(sessionStorage.getItem(KEY) || "0", 10) || 0;
          var tries = 0;
          (function tick() {
            var hy = hashTarget();
            var target = hy != null ? hy : saved;
            if (target <= 0) return;
            var ready =
              document.documentElement.scrollHeight >=
              target + window.innerHeight - 1;
            if (ready || tries++ > 180) {
              // Jump straight there — never animate the restore (html has scroll-behavior:
              // smooth for in-page anchor clicks, which we don't want on refresh).
              window.scrollTo({ top: target, left: 0, behavior: "instant" });
            } else {
              requestAnimationFrame(tick);
            }
          })();
        }

        if (document.readyState === "complete") restore();
        else addEventListener("load", restore);
      })();
    </script>
  </body>
</html>
