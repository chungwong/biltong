name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/biltong-dioxus-wasm-qwtulr
      - main
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.9 --locked

      - name: Build (compiles Tailwind + WASM bundle)
        run: dx bundle --platform web --release

      - name: Locate bundle output
        id: out
        run: |
          # dx writes the static site to target/dx/biltong/release/web/public
          DIR=$(find target/dx -type d -name public | head -n 1)
          echo "Bundle dir: $DIR"
          # SPA fallback so deep links / refreshes resolve.
          cp "$DIR/index.html" "$DIR/404.html"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
