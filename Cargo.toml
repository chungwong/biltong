[package]
name = "biltong"
version = "0.1.0"
edition = "2021"
description = "How to make biltong — a pure-WASM Dioxus port hosted on GitHub Pages"

[dependencies]
dioxus = { version = "0.7", features = ["web"] }

# Smaller, faster WASM for the GitHub Pages bundle.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
